name: Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "npm-baolq-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: npm install --global npm@11.11.1
      - run: node scripts/assert-release-tag.mjs
      - run: pnpm verify
      - name: Resolve package specifier
        id: package
        run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
      - name: Require an unpublished target version
        run: |
          if npm view "${{ steps.package.outputs.spec }}" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing package ${{ steps.package.outputs.spec }}."
            exit 1
          fi
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published entries
        run: |
          test "$(npm view '${{ steps.package.outputs.spec }}' version)" = "0.1.0"
          mkdir "$RUNNER_TEMP/svg-motion-registry-smoke"
          cd "$RUNNER_TEMP/svg-motion-registry-smoke"
          npm init --yes
          npm install "${{ steps.package.outputs.spec }}" react@18
          node --input-type=module -e 'const core=await import("@baolq/svg-motion"); const react=await import("@baolq/svg-motion/react"); if(!core.prepareSvg||!react.SvgMotion) process.exit(1)'
      - name: Deprecate the previous package identity
        if: github.ref_name == 'npm-baolq-v0.1.0'
        run: npm deprecate @baole-space/svg-motion@0.1.0 "Moved to @baolq/svg-motion"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
